services:
  kitsune-router:
    image: ghcr.io/bykitsune/kitsune-router:latest
    container_name: kitsune-router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - kitsune-router-data:/app/data
    # Optional: copy .env.example to .env to override secrets/ports. The image
    # provisions JWT_SECRET itself, so no .env is required to get started.
    # `required: false` keeps `docker compose up` working when it is absent.
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  kitsune-router-data:
    # To reuse an existing stopped installation's volume, explicitly set
    # KITSUNE_ROUTER_DATA_VOLUME to its name. Never run both gateways on it.
    name: ${KITSUNE_ROUTER_DATA_VOLUME:-kitsune-router-data}

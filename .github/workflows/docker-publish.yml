name: Publish Canonical GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag (must match all package versions)"
        required: true
        default: "v1.0.7"

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/bykitsune/kitsune-router

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      KITSUNE_REQUIRE_BROWSER_TESTS: "1"
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long-for-ci-simulation
      KITSUNE_ROUTER_PEER_TOKEN: test-peer-token-for-ci-1234567890abcdef

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Validate release tag and source
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REPOSITORY" = "ByKitsune/kitsune-router"
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Isolate application state before dependency lifecycle scripts
        run: node scripts/release-publication-helpers.mjs isolate

      - name: Install locked test and application dependencies
        run: |
          npm ci
          npm --prefix tests ci

      - name: Install Chromium for isolated browser checks
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run synthetic Usage browser regressions first
        run: npm test -- --maxWorkers=1 tests/unit/upstream-usage-dashboard-browser.test.js

      - name: Verify exact source with shared CI gates
        run: node scripts/release-publication-helpers.mjs verify-source

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile immutable version digests before any build
        id: immutable
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-canonical-container.mjs prepare

      - name: Check current registry latest versions before promotion
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-canonical-container.mjs latest

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.promote }}
          labels: |
            org.opencontainers.image.title=Kitsune Router
            org.opencontainers.image.description=Provider-neutral AI gateway. Your models. Your routes.
            org.opencontainers.image.vendor=ByKitsune
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push verified release source
        if: steps.immutable.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          # Fetch the exact verified commit, not files mutated by installs/tests.
          context: ${{ steps.immutable.outputs.context }}
          push: true
          # Never build onto latest or overwrite a version found by preflight.
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/bykitsune/kitsune-router:buildcache
          cache-to: type=registry,ref=ghcr.io/bykitsune/kitsune-router:buildcache,mode=max
          platforms: linux/amd64
          # Minimal provenance excludes build arguments/environment; no build secrets.
          provenance: mode=min
          sbom: true

      - name: Verify immutable digest and attached provenance and SBOM
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.immutable.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/publish-canonical-container.mjs verify

      - name: Verify the published immutable image with its default entrypoint
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.immutable.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/verify-published-container.mjs "$GHCR_IMAGE@$RELEASE_DIGEST" "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Promote latest from the original verified digest without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIGEST: ${{ steps.immutable.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/publish-canonical-container.mjs promote

      - name: Preserve exact-SHA source verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: verification/${{ github.sha }}/
          if-no-files-found: warn

name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUN_REAL: "0"
      RUN_E2E: "0"
      RUN_LIVE_TESTS: "0"
      AG_CACHE_TEST: "0"
      MODEL_CATALOG_SYNC: "off"
      DISABLE_BACKGROUND_TOKEN_REFRESH: "1"
      ZENROUTER_DISABLE_MITM: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long-for-ci-simulation
      ZENROUTER_PEER_TOKEN: test-peer-token-for-ci-1234567890abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Isolate application state
        run: node scripts/release-publication-helpers.mjs isolate
      - name: Install locked test and application dependencies
        run: |
          npm ci
          npm --prefix tests ci
      - name: Verify exact source with shared release gates
        run: node scripts/release-publication-helpers.mjs verify-source
      - name: Preserve exact-SHA test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: verification/${{ github.sha }}/
          if-no-files-found: warn
  dependency-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit application dependencies
        run: npm audit --audit-level=low
      - name: Audit CLI dependencies
        run: npm --prefix cli audit --audit-level=low
      - name: Audit test dependencies
        run: npm --prefix tests audit --audit-level=low
      - name: Audit documentation dependencies
        run: npm --prefix gitbook audit --audit-level=low
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gitbook/package-lock.json
      - name: Isolate application state before dependency lifecycle scripts
        run: node scripts/release-publication-helpers.mjs isolate
      - run: npm --prefix gitbook ci
      - run: npm --prefix gitbook test
      - run: npm --prefix gitbook run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

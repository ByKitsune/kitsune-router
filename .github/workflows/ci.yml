name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUN_REAL: "0"
      RUN_E2E: "0"
      RUN_LIVE_TESTS: "0"
      AG_CACHE_TEST: "0"
      MODEL_CATALOG_SYNC: "off"
      DISABLE_BACKGROUND_TOKEN_REFRESH: "1"
      ZENROUTER_DISABLE_MITM: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long-for-ci-simulation
      ZENROUTER_PEER_TOKEN: test-peer-token-for-ci-1234567890abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - run: npm ci
      - name: Install tests deps
        run: cd tests && npm ci
      - name: Isolate application state
        run: |
          mkdir -p "$RUNNER_TEMP/zenrouter-home" "$RUNNER_TEMP/zenrouter-data" verification
          echo "HOME=$RUNNER_TEMP/zenrouter-home" >> "$GITHUB_ENV"
          echo "DATA_DIR=$RUNNER_TEMP/zenrouter-data" >> "$GITHUB_ENV"
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=verification/vitest.json
        env:
          NODE_ENV: test
      - run: node tests/__baseline__/verify-no-regression.mjs verification/vitest.json
      - run: npm run test:compat
      - name: Provider identity and compatibility baselines
        run: |
          node scripts/generate-provider-identity.mjs --check
          node tests/__baseline__/verify-providers.mjs
          node tests/__baseline__/verify-alias.mjs
          node tests/__baseline__/verify-oauth-urls.mjs
      - run: npm run build
        env:
          NEXT_PHASE: phase-production-build
      - name: Preserve exact-SHA test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: verification/vitest.json
          if-no-files-found: warn
  dependency-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit application dependencies
        run: npm audit --audit-level=low
      - name: Audit CLI dependencies
        run: npm --prefix cli audit --audit-level=low
      - name: Audit test dependencies
        run: npm --prefix tests audit --audit-level=low
      - name: Audit documentation dependencies
        run: npm --prefix gitbook audit --audit-level=low
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gitbook/package-lock.json
      - run: npm --prefix gitbook ci
      - run: npm --prefix gitbook test
      - run: npm --prefix gitbook run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

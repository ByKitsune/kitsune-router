name: Read-only npm release diagnostics

# Temporary diagnostic branch only: no publication, tag mutation or rebuild.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to inspect"
        required: true
        default: "v0.9.12"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Verify source without publishing
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          git rev-parse HEAD
          npm config get registry
      - name: Authenticate without exposing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org --loglevel=error
      - name: Inspect target package permission only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          const result = JSON.parse(execFileSync("npm", ["access", "list", "packages", "joyccn", "--json", "--loglevel=error"], { encoding: "utf8" }));
          console.log(JSON.stringify({ package: "@joyccn/zenrouter", permission: result["@joyccn/zenrouter"] ?? null }));
          NODE

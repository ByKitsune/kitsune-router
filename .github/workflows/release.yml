name: Read-only npm release diagnostics

# Temporary diagnostic branch only: no publication, tag mutation or rebuild.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to inspect"
        required: true
        default: "v0.9.12"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Verify source without publishing
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          git rev-parse HEAD
          npm config get registry
      - name: Authenticate without exposing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org --loglevel=error
      - name: Inspect target package permission only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.NODE_AUTH_TOKEN}` };
          const identity = await fetch("https://registry.npmjs.org/-/whoami", { headers });
          if (!identity.ok) throw Error(`Identity status: ${identity.status}`);
          const { username } = await identity.json();
          const permissions = await fetch(`https://registry.npmjs.org/-/user/${encodeURIComponent(username)}/package`, { headers });
          const packages = permissions.ok ? await permissions.json() : {};
          const visibility = await fetch("https://registry.npmjs.org/-/package/@joyccn%2fzenrouter/visibility", { headers });
          const info = visibility.ok ? await visibility.json() : {};
          console.log(JSON.stringify({ username, package: "@joyccn/zenrouter", permissionStatus: permissions.status, permission: packages["@joyccn/zenrouter"] ?? null, visibilityStatus: visibility.status, public: info.public, publishRequiresTfa: info.publish_requires_tfa }));
          NODE
